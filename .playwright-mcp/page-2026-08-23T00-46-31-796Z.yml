      - button "I urge you do not get discouraged from your failures. “I have not failed 10,000 times — I've successfully found 10,000 ways that will not work.” — Thomas Edison on the lightbulb." [ref=f4e35]
      - button "How did these niceties evolve to such complex lies? It’s absolutely disgusting how we look each other in the eye and tell such blatant lies all under the guise of being 'polite'. 'How are you?' 'I’m good.' A foul lie told by most on a daily basis. How did it come to this… why did it come to this? The act of being genuine is becoming increasingly rare as this world goes to shit. Being honest is frowned upon — how ironic this infamous truth. One cannot be too blunt for they may offend others easily. I refute this means of interaction and I will uphold my belief in being honest." [ref=f4e37]
      - 'button "Attraction: A subject all want to master but few actually study as a course. Although beauty is indeed in the eye of the beholder, there are some set baselines we can cast across the general populous. And it is through that we have something to educate ourselves on. Looks play a key factor in attraction, but unless you are in the upper echelons of society it is no longer very leverageable (at least for men). So what else is there? Personality is certainty, but the point I really want to touch upon is shared interests, mutual understanding, the feeling that ''this person gets me, they see me for who I am.'' This I find plays an immense role in attraction and can be either created through long periods of time spent with a person or coincidences whereas you and the person of interest are quite similar. This will make or break those first talking stages." [ref=f4e39]'
