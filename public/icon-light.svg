<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="goldGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="emeraldGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#059669" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="blackGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b" />
      <stop offset="100%" stop-color="#09090b" />
    </linearGradient>
  </defs>

  <!-- Clean bright porcelain canvas -->
  <rect width="512" height="512" rx="112" fill="#ffffff" stroke="#e2e8f0" stroke-width="4" />

  <g transform="translate(256, 260)">
    <!-- Base Ancestral Foundation (Obsidian Black Tier) -->
    <path d="M -160 110 C -110 95 110 95 160 110 L 130 145 C 80 135 -80 135 -130 145 Z" fill="url(#blackGrad1)" />

    <!-- Lower Echelon Tier (Lush Emerald Green) -->
    <path d="M -130 90 C -70 50 70 50 130 90 L 110 40 C 60 10 -60 10 -110 40 Z" fill="url(#emeraldGrad1)" />

    <!-- Mid Echelon Tier (Obsidian Black) -->
    <path d="M -90 25 C -40 -15 40 -15 90 25 L 70 -35 C 35 -65 -35 -65 -70 -35 Z" fill="url(#blackGrad1)" />

    <!-- Apex Trigonolith Summit (Radiant Jamaican Gold) -->
    <path d="M -50 -50 C -20 -95 0 -140 0 -155 C 0 -140 20 -95 50 -50 C 20 -65 -20 -65 -50 -50 Z" fill="url(#goldGrad1)" />

    <!-- Sacred Ancestral Eye / Solar Meridian (Pure Gold Core with Green Ring) -->
    <circle cx="0" cy="-25" r="18" fill="url(#goldGrad1)" />
    <circle cx="0" cy="-25" r="28" fill="none" stroke="#10b981" stroke-width="3.5" stroke-dasharray="6 4" />

    <!-- Flank Chevrons in Emerald & Gold -->
    <path d="M -140 10 L -170 35 L -140 60" fill="none" stroke="#059669" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 140 10 L 170 35 L 140 60" fill="none" stroke="#059669" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>